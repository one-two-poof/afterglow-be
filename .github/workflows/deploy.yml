name: CI/CD Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ec2
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: "21"
          cache: gradle

      - name: Build JAR
        run: |
          chmod +x gradlew
          ./gradlew bootJar -q --no-daemon

      - name: Prepare SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/afterglow-be-key.pem
          chmod 600 ~/.ssh/afterglow-be-key.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload JAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/afterglow-be-key.pem \
            build/libs/afterglow-be-0.0.1-SNAPSHOT.jar \
            "${EC2_USER}@${EC2_HOST}:/opt/afterglow/afterglow-be.jar.new"

      - name: Restart service
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/afterglow-be-key.pem "${EC2_USER}@${EC2_HOST}" '
            set -e
            mv /opt/afterglow/afterglow-be.jar.new /opt/afterglow/afterglow-be.jar
            sudo systemctl restart afterglow
            sudo systemctl is-active afterglow
            for i in $(seq 1 30); do
              if curl -sf http://127.0.0.1:8080/api/health; then
                echo
                echo "Health check OK"
                exit 0
              fi
              echo "Waiting for app... ($i/30)"
              sleep 3
            done
            echo "Health check failed"
            sudo journalctl -u afterglow -n 50 --no-pager
            exit 1
          '
