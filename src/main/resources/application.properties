spring.application.name=afterglow-be
spring.profiles.active=local,dev

server.port=8080

notion.api-token=${NOTION_API_TOKEN:}
notion.database-id=${NOTION_DATABASE_ID:}
notion.api-version=2022-06-28
# Notion DB 컬럼명과 동일하게 (병원명 title 컬럼, 상태 select 컬럼)
notion.title-property=${NOTION_TITLE_PROPERTY:Name}
notion.status-property=${NOTION_STATUS_PROPERTY:Status}

sync.enabled=true
sync.cron=${SYNC_CRON:0 */5 * * * *}

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,https://after-glow.duckdns.org

# Google OAuth2 (Google Cloud Console에서 발급, 웹 로그인용 - client-secret 필요)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# JWT
jwt.secret=${JWT_SECRET:afterglow-default-secret-change-in-production-must-be-long-enough}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# 관리자 전용 로그인(/admin/login.html, POST /api/admin/login). 구글 로그인과 무관.
admin.email=${ADMIN_EMAIL:dunaduneo@gmail.com}
admin.password=${ADMIN_PASSWORD:}

# 구글 로그인 성공 후 리다이렉트할 프론트엔드 콜백 주소.
# 로컬은 기본값 그대로, 운영은 OAUTH_FRONTEND_REDIRECT_URL 환경변수로 오버라이드.
app.oauth.frontend-redirect-url=${OAUTH_FRONTEND_REDIRECT_URL:afterglow://oauth/callback}

# 한국관광공사 의료관광 API (공공데이터포털)
medicaltourism.service-key=${DATA_GO_KR_SERVICE_KEY:}
medicaltourism.base-url=https://apis.data.go.kr/B551011/MdclTursmService
medicaltourism.mobile-app=afterglow
medicaltourism.default-lang=ENG

# 카카오 로컬 API (병원/장소 동기화용)
kakao.rest-api-key=${KAKAO_REST_API_KEY:}
kakao.base-url=https://dapi.kakao.com

# 병원 테이블 동기화 (관광공사 + 카카오). 기본: 매일 새벽 4시.
hospital.sync.enabled=true
hospital.sync.cron=${HOSPITAL_SYNC_CRON:0 0 4 * * *}

# 한국관광공사 TourAPI 4.0 (국문 관광정보 서비스, KorService2). 공공데이터포털 동일 서비스키 사용.
# EngService2/JpnService2는 place_translations 백필 전용 — 서비스키는 같아도 공공데이터포털에서
# 서비스별 활용신청이 따로 필요한 경우가 많다.
tourapi.service-key=${DATA_GO_KR_SERVICE_KEY:}
tourapi.base-url=https://apis.data.go.kr/B551011/KorService2
tourapi.eng-base-url=https://apis.data.go.kr/B551011/EngService2
tourapi.jpn-base-url=https://apis.data.go.kr/B551011/JpnService2
tourapi.mobile-app=afterglow

# 숙소 테이블 동기화 (관광공사 TourAPI + 카카오, 강남/서초 한정). 기본: 매일 새벽 4시 30분.
accommodation.sync.enabled=true
accommodation.sync.cron=${ACCOMMODATION_SYNC_CRON:0 30 4 * * *}

# 관광명소 테이블 동기화 (관광공사 TourAPI + 카카오, 강남/서초 한정, 관광지/문화시설/축제공연행사/쇼핑/음식점).
# 기본: 매일 새벽 4시 45분.
attraction.sync.enabled=true
attraction.sync.cron=${ATTRACTION_SYNC_CRON:0 45 4 * * *}

# place_translations 백필 (병원/숙소/관광명소 동기화가 TourAPI·의료관광 API 공식 번역으로 못 채운
# 자리를 SeedTranslationProvider로 채움). 기본: 매일 새벽 5시 30분(세 동기화 다음).
place-translation.backfill.enabled=true
place-translation.backfill.cron=${PLACE_TRANSLATION_BACKFILL_CRON:0 30 5 * * *}

# place_details 백필 (tourism_content_id가 있는 행의 소개글/이미지/운영정보를 TourAPI 상세 조회
# detailCommon2/detailIntro2/detailImage2, 병원은 의료관광 detailMdclTursm으로 채움).
# 기본: 매일 새벽 5시(세 동기화 다음, 번역 백필 5시 30분보다 먼저).
place-detail.backfill.enabled=true
place-detail.backfill.cron=${PLACE_DETAIL_BACKFILL_CRON:0 0 5 * * *}

# Swagger / OpenAPI (springdoc)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# 그늘길 라우팅 프로토타입 (batch/src/main.py 산출물, 리포 루트 기준 상대경로)
shade.data-dir=data/out
# 클릭 좌표에서 최근접 노드까지 거리가 이 값을 넘으면 조용히 스냅하지 않고 에러를 낸다.
# 공원처럼 노드 밀도가 낮은 지역에서 너무 타이트하면 정상 클릭도 거부될 수 있어 실측 후 조정.
shade.max-snap-distance-m=300
