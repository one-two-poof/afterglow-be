spring.application.name=afterglow-be
spring.profiles.active=local,dev

server.port=8080

notion.api-token=${NOTION_API_TOKEN:}
notion.database-id=${NOTION_DATABASE_ID:}
notion.api-version=2022-06-28
# Notion DB 컬럼명과 동일하게 (병원명 title 컬럼, 상태 select 컬럼)
notion.title-property=${NOTION_TITLE_PROPERTY:Name}
notion.status-property=${NOTION_STATUS_PROPERTY:Status}

sync.enabled=true
sync.cron=${SYNC_CRON:0 */5 * * * *}

app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# Google OAuth2 (Google Cloud Console에서 발급)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

# JWT
jwt.secret=${JWT_SECRET:afterglow-default-secret-change-in-production-must-be-long-enough}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# 한국관광공사 의료관광 API (공공데이터포털)
medicaltourism.service-key=${DATA_GO_KR_SERVICE_KEY:}
medicaltourism.base-url=https://apis.data.go.kr/B551011/MdclTursmService
medicaltourism.mobile-app=afterglow
medicaltourism.default-lang=ENG

# Swagger / OpenAPI (springdoc)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# 그늘길 라우팅 프로토타입 (batch/src/main.py 산출물, 리포 루트 기준 상대경로)
shade.data-dir=data/out
# 클릭 좌표에서 최근접 노드까지 거리가 이 값을 넘으면 조용히 스냅하지 않고 에러를 낸다.
# 공원처럼 노드 밀도가 낮은 지역에서 너무 타이트하면 정상 클릭도 거부될 수 있어 실측 후 조정.
shade.max-snap-distance-m=300
