spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/afterglow}
spring.datasource.username=${DATABASE_USERNAME:afterglow}
spring.datasource.password=${DATABASE_PASSWORD:afterglow}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# nginx가 TLS를 종료하고 X-Forwarded-Proto/X-Forwarded-For를 붙여서 넘겨주므로,
# Spring이 그 헤더를 반영해서 절대 URL(OAuth2 redirect_uri 등)을 https 기준으로 만들도록 함.
# 없으면 리버스 프록시 뒤에서 http:// 링크가 생성돼 구글 redirect_uri_mismatch가 남.
server.forward-headers-strategy=framework
