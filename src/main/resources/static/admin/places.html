<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>장소 관리</title>
<style>
  :root {
    --bg: #f6f7fa;
    --surface: #ffffff;
    --ink: #1b2233;
    --muted: #5b6472;
    --border: #e2e5ec;
    --accent: #3e63dd;
    --accent-soft: #eef1fe;
    --danger: #d1414a;
    --danger-soft: #fdecee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, "Segoe UI", "Pretendard Variable", Pretendard, sans-serif;
    padding: 32px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .subtitle { color: var(--muted); font-size: 13px; margin: 0 0 20px; }

  .token-bar {
    display: flex; gap: 8px; align-items: center;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 12px 14px; margin-bottom: 20px; flex-wrap: wrap;
  }
  .token-bar label { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
  .token-bar input {
    flex: 1; min-width: 240px; padding: 7px 10px; border: 1px solid var(--border);
    border-radius: 6px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px;
  }
  .token-status { font-size: 12px; padding: 3px 8px; border-radius: 5px; white-space: nowrap; }
  .token-status.ok { color: #1e9e6b; background: #e7f7ef; }
  .token-status.missing { color: var(--danger); background: var(--danger-soft); }

  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .count { font-size: 13px; color: var(--muted); }
  button {
    font-family: inherit; font-size: 13px; cursor: pointer; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    padding: 7px 14px;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button.danger { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }

  table { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th { background: var(--accent-soft); color: var(--accent); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; }
  tr:last-child td { border-bottom: none; }
  td.actions { white-space: nowrap; display: flex; gap: 6px; }
  .empty { padding: 32px; text-align: center; color: var(--muted); }
  .badge { font-size: 11px; padding: 2px 6px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
  .type-pill { font-size: 11px; padding: 2px 8px; border-radius: 10px; white-space: nowrap; }
  .type-pill.HOSPITAL { background: #fdecee; color: var(--danger); }
  .type-pill.ACCOMMODATION { background: #eef1fe; color: var(--accent); }
  .type-pill.ATTRACTION { background: #e7f7ef; color: #1e9e6b; }

  .modal-backdrop {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35);
    align-items: center; justify-content: center; z-index: 10;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 12px; padding: 24px; width: 480px; max-width: 92vw;
    max-height: 88vh; overflow-y: auto;
  }
  .modal h2 { margin: 0 0 16px; font-size: 16px; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
  .field input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px; font-family: inherit; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }
  .error-msg { color: var(--danger); font-size: 12.5px; margin-top: 8px; min-height: 16px; }

  .pagination { display: flex; justify-content: center; align-items: center; gap: 10px; margin-top: 16px; }
  .pagination button { padding: 6px 12px; }
  .pagination span { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>

<h1>장소 관리</h1>
<p class="subtitle">/api/places — 조회는 공개, 추가·수정·삭제는 관리자 로그인 필요</p>

<div class="token-bar">
  <label for="token-input">JWT 토큰</label>
  <input id="token-input" type="password" placeholder="Bearer 토큰 (Authorization 헤더에 사용)">
  <button id="token-save">저장</button>
  <span id="token-status" class="token-status missing">토큰 없음 (조회만 가능)</span>
  <a href="/admin/login.html" id="login-link"><button type="button">관리자 로그인</button></a>
  <button type="button" id="logout-btn" style="display:none;">로그아웃</button>
</div>

<div class="toolbar">
  <span id="count" class="count">불러오는 중...</span>
  <div style="display:flex; gap:8px; align-items:center;">
    <input id="search-input" type="text" placeholder="이름으로 검색" style="padding:7px 10px; border:1px solid var(--border); border-radius:7px; font-size:13px; font-family:inherit; min-width:200px;">
    <button id="search-btn">검색</button>
    <button id="search-clear-btn" style="display:none;">전체보기</button>
    <select id="type-filter" style="padding:7px 10px; border:1px solid var(--border); border-radius:7px; font-size:13px; font-family:inherit;">
      <option value="">전체 종류</option>
      <option value="HOSPITAL">병원</option>
      <option value="ACCOMMODATION">숙소</option>
      <option value="ATTRACTION">장소</option>
    </select>
    <button class="primary" id="add-btn">+ 새 장소 추가</button>
  </div>
</div>

<table>
  <thead id="thead"></thead>
  <tbody id="rows"></tbody>
</table>
<div id="empty" class="empty" style="display:none;">등록된 장소가 없습니다.</div>
<div class="pagination" id="pagination" style="display:none;">
  <button type="button" id="prev-page-btn">이전</button>
  <span id="page-indicator"></span>
  <button type="button" id="next-page-btn">다음</button>
</div>

<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal">
    <h2 id="modal-title">새 장소 추가</h2>
    <form id="place-form">
      <div class="field"><label>종류 *</label>
        <select name="placeType" required style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit;">
          <option value="HOSPITAL">병원</option>
          <option value="ACCOMMODATION">숙소</option>
          <option value="ATTRACTION">장소</option>
        </select>
      </div>
      <div class="field"><label>place_id (카카오 고유 ID)</label><input name="placeId" required></div>
      <div class="field"><label>장소명 *</label><input name="placeName" required></div>
      <div class="field"><label>카테고리</label><input name="categoryName" placeholder="문화,예술 > 영화 > CGV"></div>
      <div class="field"><label>카테고리 그룹명 (categoryGroupName)</label><input name="categoryGroupName" placeholder="문화시설"></div>
      <div class="field"><label>기본 주소</label><input name="addressName"></div>
      <div class="field"><label>도로명 주소</label><input name="roadAddressName"></div>
      <div class="field"><label>위도 (mapY) *</label><input name="mapY" type="number" step="any" required></div>
      <div class="field"><label>경도 (mapX) *</label><input name="mapX" type="number" step="any" required></div>
      <div class="field"><label>이미지 URL</label><input name="image"></div>
      <div class="field"><label>전화번호</label><input name="phone"></div>
      <div class="field"><label>장소 URL</label><input name="placeUrl" placeholder="http://place.map.kakao.com/..."></div>

      <div class="field" style="border-top:1px solid var(--border); padding-top:12px; margin-top:4px;">
        <label style="color:var(--ink); font-weight:600;">ML 태그 / 도보 제약 (선택)</label>
      </div>
      <div class="field"><label>주 용도 코드 (primaryType)</label><input name="primaryType" placeholder="cultural_facility"></div>
      <div class="field"><label>주 용도명 (primaryTypeName)</label><input name="primaryTypeName" placeholder="문화시설"></div>
      <div class="field"><label>태그 모음 (collectionTypes)</label><input name="collectionTypes"></div>
      <div class="field"><label>피부시술 신뢰도</label><input name="skinTreatmentConfidence"></div>
      <div class="field"><label>시술 키워드 (| 구분)</label><input name="skinTreatmentSignals" placeholder="리프팅|보톡스|필러"></div>
      <div class="field"><label>실내 여부</label>
        <select name="isIndoor" style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit;">
          <option value="">미설정</option><option value="true">예</option><option value="false">아니오</option>
        </select>
      </div>
      <div class="field"><label>발열원 여부</label>
        <select name="isHeatSource" style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit;">
          <option value="">미설정</option><option value="true">예</option><option value="false">아니오</option>
        </select>
      </div>
      <div class="field"><label>마사지 적합 여부</label>
        <select name="isMassageSpot" style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit;">
          <option value="">미설정</option><option value="true">예</option><option value="false">아니오</option>
        </select>
      </div>
      <div class="field"><label>도보 난이도 (1~5)</label><input name="walkHard" type="number" step="1" min="1" max="5"></div>
      <div class="field"><label>결측 플래그</label>
        <select name="isNa" style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:13px; font-family:inherit;">
          <option value="">미설정</option><option value="true">예</option><option value="false">아니오</option>
        </select>
      </div>
      <div class="error-msg" id="form-error"></div>
      <div class="modal-actions">
        <button type="button" id="cancel-btn">취소</button>
        <button type="submit" class="primary" id="submit-btn">저장</button>
      </div>
    </form>
  </div>
</div>

<script>
  const API_BASE = '/api/places';
  const tokenInput = document.getElementById('token-input');
  const tokenStatus = document.getElementById('token-status');
  const theadEl = document.getElementById('thead');
  const rowsEl = document.getElementById('rows');
  const emptyEl = document.getElementById('empty');
  const countEl = document.getElementById('count');
  const modalBackdrop = document.getElementById('modal-backdrop');
  const modalTitle = document.getElementById('modal-title');
  const form = document.getElementById('place-form');
  const formError = document.getElementById('form-error');

  let editingId = null;

  function getToken() {
    return localStorage.getItem('afterglow_admin_jwt') || '';
  }

  const loginLink = document.getElementById('login-link');
  const logoutBtn = document.getElementById('logout-btn');

  function refreshTokenStatus() {
    const token = getToken();
    tokenInput.value = token;
    if (token) {
      tokenStatus.textContent = '토큰 설정됨 (쓰기 가능)';
      tokenStatus.className = 'token-status ok';
      loginLink.style.display = 'none';
      logoutBtn.style.display = 'inline-block';
    } else {
      tokenStatus.textContent = '토큰 없음 (조회만 가능)';
      tokenStatus.className = 'token-status missing';
      loginLink.style.display = 'inline-block';
      logoutBtn.style.display = 'none';
    }
  }

  document.getElementById('token-save').addEventListener('click', () => {
    localStorage.setItem('afterglow_admin_jwt', tokenInput.value.trim());
    refreshTokenStatus();
  });

  logoutBtn.addEventListener('click', () => {
    localStorage.removeItem('afterglow_admin_jwt');
    refreshTokenStatus();
  });

  function authHeaders() {
    const token = getToken();
    const headers = { 'Content-Type': 'application/json' };
    if (token) headers['Authorization'] = 'Bearer ' + token;
    return headers;
  }

  const TYPE_LABELS = { HOSPITAL: '병원', ACCOMMODATION: '숙소', ATTRACTION: '장소' };

  const PAGE_SIZE = 10;
  let currentItems = [];
  let currentPage = 1;

  async function loadPlaces(name) {
    countEl.textContent = '불러오는 중...';
    const url = name ? `${API_BASE}?name=${encodeURIComponent(name)}` : API_BASE;
    const res = await fetch(url);
    if (!res.ok) {
      countEl.textContent = '목록을 불러오지 못했습니다 (HTTP ' + res.status + ')';
      return;
    }
    let items = await res.json();
    const type = typeFilter.value;
    if (type) items = items.filter((item) => item.placeType === type);
    currentItems = items;
    currentPage = 1;
    const suffix = [name ? `"${name}" 검색` : null, type ? TYPE_LABELS[type] : null].filter(Boolean).join(', ');
    countEl.textContent = items.length + '개' + (suffix ? ` (${suffix})` : '');
    renderPage();
  }

  function renderPage() {
    const totalPages = Math.max(1, Math.ceil(currentItems.length / PAGE_SIZE));
    if (currentPage > totalPages) currentPage = totalPages;
    const start = (currentPage - 1) * PAGE_SIZE;
    renderRows(currentItems.slice(start, start + PAGE_SIZE));

    const paginationEl = document.getElementById('pagination');
    paginationEl.style.display = currentItems.length > PAGE_SIZE ? 'flex' : 'none';
    document.getElementById('page-indicator').textContent = `${currentPage} / ${totalPages}`;
    document.getElementById('prev-page-btn').disabled = currentPage <= 1;
    document.getElementById('next-page-btn').disabled = currentPage >= totalPages;
  }

  document.getElementById('prev-page-btn').addEventListener('click', () => {
    if (currentPage > 1) { currentPage--; renderPage(); }
  });
  document.getElementById('next-page-btn').addEventListener('click', () => {
    const totalPages = Math.max(1, Math.ceil(currentItems.length / PAGE_SIZE));
    if (currentPage < totalPages) { currentPage++; renderPage(); }
  });

  const searchInput = document.getElementById('search-input');
  const searchClearBtn = document.getElementById('search-clear-btn');
  const typeFilter = document.getElementById('type-filter');

  function runSearch() {
    const term = searchInput.value.trim();
    searchClearBtn.style.display = term ? 'inline-block' : 'none';
    loadPlaces(term);
  }

  document.getElementById('search-btn').addEventListener('click', runSearch);
  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') runSearch();
  });
  searchClearBtn.addEventListener('click', () => {
    searchInput.value = '';
    searchClearBtn.style.display = 'none';
    loadPlaces();
  });
  typeFilter.addEventListener('change', () => loadPlaces(searchInput.value.trim()));

  // 기본 컬럼은 종류 무관 항상 표시. 병원(HOSPITAL)은 피부시술 태그, 관광명소(ATTRACTION)는
  // 도보 제약 태그가 서로 겹치지 않는 값이라 "전체 종류" 볼 때 반은 항상 비는 문제가 있었음 —
  // 그래서 상단 종류 필터에 맞춰 관련 있는 컬럼만 끼워넣는다(전체 종류일 땐 기본만).
  // 숙소(ACCOMMODATION)는 도보 제약 태그 CSV(gangnam_seocho_places_with_constraints.csv) 대상이
  // 아니라서 DB에 전부 null — WALK_COLUMNS를 붙이지 않는다.
  const BASE_COLUMNS = [
    { label: 'ID', render: (item) => item.id },
    { label: '종류', render: (item) =>
        `<span class="type-pill ${escapeAttr(item.placeType || '')}">${escapeHtml(TYPE_LABELS[item.placeType] || item.placeType || '-')}</span>` },
    { label: '이름', render: (item) => `<strong>${escapeHtml(item.placeName)}</strong>` },
    { label: '카테고리', render: (item) => escapeHtml(item.categoryName || '') },
  ];

  const HOSPITAL_COLUMNS = [
    { label: '피부시술 신뢰도', render: (item) => escapeHtml(item.skinTreatmentConfidence || '-') },
    { label: '시술 키워드', render: (item) => escapeHtml((item.skinTreatmentSignals || '').split('|').map((s) => s.replace(/^kakao_category:/, '')).filter(Boolean).join(', ') || '-') },
  ];

  const WALK_COLUMNS = [
    { label: '실내', render: (item) => formatBool(item.isIndoor) },
    { label: '발열원', render: (item) => formatBool(item.isHeatSource) },
    { label: '마사지 적합', render: (item) => formatBool(item.isMassageSpot) },
    { label: '도보난이도', render: (item) => item.walkHard ?? '-' },
    { label: '결측', render: (item) => formatBool(item.isNa) },
  ];

  const TAIL_COLUMNS = [
    { label: '기본 주소', render: (item) => escapeHtml(item.addressName || '') },
    { label: '도로명 주소', render: (item) => escapeHtml(item.roadAddressName || '') },
    { label: '위도(mapY)', render: (item) => item.mapY ?? '' },
    { label: '경도(mapX)', render: (item) => item.mapX ?? '' },
    { label: '이미지', render: (item) =>
        (item.image ? `<a href="${escapeAttr(item.image)}" target="_blank" rel="noopener">보기</a>` : '-')
        + (item.imageOverridden ? ' <span class="badge">수동</span>' : '') },
    { label: '출처', render: (item) => escapeHtml(item.source || '') },
    { label: '마지막 동기화', render: (item) => (item.syncedAt ? new Date(item.syncedAt).toLocaleString('ko-KR') : '') },
    { label: '', cellClass: 'actions', render: (item) =>
        `<button data-action="edit" data-id="${item.id}">수정</button>`
        + `<button data-action="delete" data-id="${item.id}" class="danger">삭제</button>` },
  ];

  function formatBool(v) {
    if (v === true) return '예';
    if (v === false) return '아니오';
    return '-';
  }

  function currentColumns() {
    const type = typeFilter.value;
    let extra = [];
    if (type === 'HOSPITAL') extra = HOSPITAL_COLUMNS;
    else if (type === 'ATTRACTION') extra = WALK_COLUMNS;
    return [...BASE_COLUMNS, ...extra, ...TAIL_COLUMNS];
  }

  function renderRows(items) {
    const columns = currentColumns();
    theadEl.innerHTML = '<tr>' + columns.map((c) => `<th>${escapeHtml(c.label)}</th>`).join('') + '</tr>';
    rowsEl.innerHTML = '';
    emptyEl.style.display = items.length === 0 ? 'block' : 'none';
    for (const item of items) {
      const tr = document.createElement('tr');
      tr.innerHTML = columns
          .map((c) => `<td${c.cellClass ? ` class="${c.cellClass}"` : ''}>${c.render(item)}</td>`)
          .join('');
      rowsEl.appendChild(tr);
    }
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function escapeAttr(s) {
    return String(s).replace(/"/g, '&quot;');
  }

  rowsEl.addEventListener('click', async (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    const id = btn.dataset.id;
    if (btn.dataset.action === 'delete') {
      if (!confirm('정말 삭제하시겠습니까? (id=' + id + ')')) return;
      const res = await fetch(`${API_BASE}/${id}`, { method: 'DELETE', headers: authHeaders() });
      if (res.status === 401 || res.status === 403) {
        alert('삭제 권한이 없습니다. JWT 토큰을 확인해주세요.');
        return;
      }
      if (!res.ok && res.status !== 204) {
        alert('삭제 실패 (HTTP ' + res.status + ')');
        return;
      }
      loadPlaces(searchInput.value.trim());
    } else if (btn.dataset.action === 'edit') {
      const res = await fetch(`${API_BASE}/${id}`);
      if (!res.ok) { alert('불러오기 실패'); return; }
      const item = await res.json();
      openModal(item);
    }
  });

  document.getElementById('add-btn').addEventListener('click', () => openModal(null));
  document.getElementById('cancel-btn').addEventListener('click', closeModal);
  modalBackdrop.addEventListener('click', (e) => { if (e.target === modalBackdrop) closeModal(); });

  function boolToSelectValue(v) {
    if (v === true) return 'true';
    if (v === false) return 'false';
    return '';
  }
  function selectValueToBool(v) {
    if (v === 'true') return true;
    if (v === 'false') return false;
    return null;
  }

  function openModal(item) {
    formError.textContent = '';
    editingId = item ? item.id : null;
    modalTitle.textContent = item ? `장소 수정 (id=${item.id})` : '새 장소 추가';
    form.placeType.value = item?.placeType || 'HOSPITAL';
    form.placeId.value = item?.placeId || '';
    form.placeId.disabled = !!item; // place_id는 수정 시 변경 불가 (매칭 키)
    form.placeName.value = item?.placeName || '';
    form.categoryName.value = item?.categoryName || '';
    form.categoryGroupName.value = item?.categoryGroupName || '';
    form.addressName.value = item?.addressName || '';
    form.roadAddressName.value = item?.roadAddressName || '';
    form.mapY.value = item?.mapY ?? '';
    form.mapX.value = item?.mapX ?? '';
    form.image.value = item?.image || '';
    form.phone.value = item?.phone || '';
    form.placeUrl.value = item?.placeUrl || '';
    form.primaryType.value = item?.primaryType || '';
    form.primaryTypeName.value = item?.primaryTypeName || '';
    form.collectionTypes.value = item?.collectionTypes || '';
    form.skinTreatmentConfidence.value = item?.skinTreatmentConfidence || '';
    form.skinTreatmentSignals.value = item?.skinTreatmentSignals || '';
    form.isIndoor.value = boolToSelectValue(item?.isIndoor);
    form.isHeatSource.value = boolToSelectValue(item?.isHeatSource);
    form.isMassageSpot.value = boolToSelectValue(item?.isMassageSpot);
    form.walkHard.value = item?.walkHard ?? '';
    form.isNa.value = boolToSelectValue(item?.isNa);
    modalBackdrop.classList.add('open');
  }

  function closeModal() {
    modalBackdrop.classList.remove('open');
    form.reset();
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    formError.textContent = '';
    if (!getToken()) {
      formError.textContent = '먼저 상단에 JWT 토큰을 입력·저장해주세요.';
      return;
    }
    const payload = {
      placeType: form.placeType.value,
      placeId: form.placeId.value.trim(),
      placeName: form.placeName.value.trim(),
      categoryName: form.categoryName.value.trim() || null,
      categoryGroupName: form.categoryGroupName.value.trim() || null,
      addressName: form.addressName.value.trim() || null,
      roadAddressName: form.roadAddressName.value.trim() || null,
      mapY: parseFloat(form.mapY.value),
      mapX: parseFloat(form.mapX.value),
      image: form.image.value.trim() || null,
      phone: form.phone.value.trim() || null,
      placeUrl: form.placeUrl.value.trim() || null,
      primaryType: form.primaryType.value.trim() || null,
      primaryTypeName: form.primaryTypeName.value.trim() || null,
      collectionTypes: form.collectionTypes.value.trim() || null,
      skinTreatmentConfidence: form.skinTreatmentConfidence.value.trim() || null,
      skinTreatmentSignals: form.skinTreatmentSignals.value.trim() || null,
      isIndoor: selectValueToBool(form.isIndoor.value),
      isHeatSource: selectValueToBool(form.isHeatSource.value),
      isMassageSpot: selectValueToBool(form.isMassageSpot.value),
      walkHard: form.walkHard.value.trim() === '' ? null : parseInt(form.walkHard.value, 10),
      isNa: selectValueToBool(form.isNa.value),
    };
    const url = editingId ? `${API_BASE}/${editingId}` : API_BASE;
    const method = editingId ? 'PUT' : 'POST';
    const res = await fetch(url, { method, headers: authHeaders(), body: JSON.stringify(payload) });
    if (res.status === 401 || res.status === 403) {
      formError.textContent = '권한이 없습니다. JWT 토큰을 확인해주세요.';
      return;
    }
    if (!res.ok) {
      formError.textContent = '저장 실패 (HTTP ' + res.status + ')';
      return;
    }
    closeModal();
    loadPlaces(searchInput.value.trim());
  });

  refreshTokenStatus();
  loadPlaces();
</script>
</body>
</html>
