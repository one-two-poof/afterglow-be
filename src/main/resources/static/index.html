<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강남구 그늘길</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@4/dist/pmtiles.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: -apple-system, "Malgun Gothic", sans-serif; }
  #map { position: absolute; inset: 0; }

  #panel {
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 1;
    background: rgba(255, 255, 255, 0.92);
    border-radius: 8px;
    padding: 14px 16px;
    width: 280px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    font-size: 13px;
  }
  #panel h1 { font-size: 15px; margin: 0 0 8px; }
  #panel p.hint { color: #555; margin: 4px 0 12px; line-height: 1.4; }

  #time-row { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  #time-row input[type=range] { flex: 1; }
  #time-label { font-variant-numeric: tabular-nums; font-weight: 600; width: 42px; }

  #status { color: #888; margin-top: 6px; min-height: 16px; }

  #result { margin-top: 10px; border-top: 1px solid #ddd; padding-top: 10px; display: none; }
  #result .row { display: flex; justify-content: space-between; margin: 4px 0; }
  #result .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; }
  .swatch.shortest { background: #888888; }
  .swatch.shady { background: #2ecc71; }

  #reset-btn {
    margin-top: 10px;
    width: 100%;
    padding: 6px 0;
    border: 1px solid #ccc;
    border-radius: 6px;
    background: #f5f5f5;
    cursor: pointer;
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="panel">
  <h1>강남구 그늘길</h1>
  <p class="hint">지도를 두 번 클릭해 출발 → 도착을 지정하면 최단 경로(회색)와 그늘 경로(초록)를 같이 보여줍니다.</p>

  <div id="time-row">
    <input type="range" id="time-slider" min="300" max="1200" step="15" value="720">
    <span id="time-label">12:00</span>
  </div>
  <div id="status"></div>

  <div id="result">
    <div class="row"><span><span class="swatch shortest"></span>최단 경로</span><span id="r-shortest"></span></div>
    <div class="row"><span><span class="swatch shady"></span>그늘 경로</span><span id="r-shady"></span></div>
    <button id="reset-btn">다시 선택</button>
  </div>
</div>

<script>
// ── 설정 ─────────────────────────────────────────────────────────
// 서버가 이 파일 자체를 서빙하므로(src/main/resources/static) 같은 오리진이라 상대경로면 충분하다.
const API_BASE = '';
// batch(shadow.py)와 동일한 단일 기준점 — 건물별이 아니라 강남구 전체에 하나의
// 태양 위치를 쓰는 프로토타입 단순화를 그대로 따른다.
const SUN_REF = { lat: 37.5172, lon: 127.0473 };
const SHADE_MIN_ALTITUDE_DEG = 3;
// shade_table을 계산한 대표 날짜와 맞춰야 시간 슬라이더 값이 서버 버킷과 일치한다.
const REPRESENTATIVE_DATE = '2026-08-15';
// buildings.geojson 통짜 fetch 대신 서버가 정적으로 서빙하는 pmtiles를
// MapLibre가 필요한 타일만 range request로 가져오게 한다.
const BUILDINGS_PMTILES_URL = 'data/buildings.pmtiles';
const BUILDINGS_SOURCE_LAYER = 'buildings';

const pmtilesProtocol = new pmtiles.Protocol();
maplibregl.addProtocol('pmtiles', pmtilesProtocol.tile);

// ── 지도 초기화 (배경: OpenStreetMap 무료 래스터 타일, API 키 불필요) ──
const map = new maplibregl.Map({
  container: 'map',
  style: {
    version: 8,
    sources: {
      osm: {
        type: 'raster',
        tiles: [
          'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
          'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
          'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
        ],
        tileSize: 256,
        attribution: '&copy; OpenStreetMap contributors'
      }
    },
    // 경로 라벨(symbol text-field) 레이어를 쓰려면 style에 glyphs가 있어야 한다.
    // MapLibre가 무료로 제공하는 데모 glyph 서버 사용 (API 키 불필요).
    glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
    layers: [{ id: 'osm', type: 'raster', source: 'osm' }]
  },
  center: [127.0276, 37.4979],
  zoom: 14
});

const emptyFC = () => ({ type: 'FeatureCollection', features: [] });

let clickPoints = [];
let markers = [];

const slider = document.getElementById('time-slider');
const timeLabel = document.getElementById('time-label');
const statusEl = document.getElementById('status');
const resultEl = document.getElementById('result');

function minutesToHHMM(mins) {
  const h = String(Math.floor(mins / 60)).padStart(2, '0');
  const m = String(mins % 60).padStart(2, '0');
  return `${h}:${m}`;
}

function currentDate() {
  return new Date(`${REPRESENTATIVE_DATE}T${minutesToHHMM(+slider.value)}:00+09:00`);
}

// ── 그림자 계산 (브라우저에서, suncalc + turf) ──────────────────────
// batch/src/shadow.py의 로직(footprint를 translate → 원본과 union → convex_hull)과
// 동일하다. union한 뒤 convex hull을 구하는 것은 두 폴리곤의 꼭짓점만으로 만든
// convex hull과 결과가 같으므로(합집합이 새 외곽 꼭짓점을 추가하지 않음),
// union 단계를 생략하고 turf.convex(원본+이동본)로 바로 계산한다.
//
// buildings는 이제 pmtiles vector 소스라 전체를 메모리에 들고 있지 않는다.
// querySourceFeatures는 현재까지 로드된 타일 안의 피처만 반환하므로, 매 프레임
// 화면 안 건물만 자연히 계산 대상이 된다 (별도 bbox 필터 불필요).
function updateShadows() {
  if (!map.getSource('buildings') || !map.getSource('shadows')) return;

  const date = currentDate();
  const sunPos = SunCalc.getPosition(date, SUN_REF.lat, SUN_REF.lon);
  const altitudeDeg = (sunPos.altitude * 180) / Math.PI;

  if (altitudeDeg <= SHADE_MIN_ALTITUDE_DEG) {
    map.getSource('shadows').setData(emptyFC());
    statusEl.textContent = '태양 고도가 낮아 그늘 없음';
    return;
  }
  statusEl.textContent = '';

  // suncalc azimuth는 남쪽 기준 시계방향(0=남). 나침반 기준(0=북) 태양 방위각으로
  // 바꾸면 (suncalcAz + 180), 그림자 방위는 거기서 다시 +180 — 두 180이 상쇄되어
  // 그림자의 나침반 방위각은 suncalc azimuth(도) 값 그대로다.
  const shadowBearingDeg = (((sunPos.azimuth * 180) / Math.PI) % 360 + 360) % 360;

  const renderedFeatures = map.querySourceFeatures('buildings', { sourceLayer: BUILDINGS_SOURCE_LAYER });

  // 벡터 타일은 폴리곤이 타일 경계에서 조각나 인접 타일에 걸쳐 중복 등장할 수
  // 있다. 같은 BLD_ID를 두 번 계산하면 그림자가 겹쳐 이음매가 진하게 보이므로
  // 건물당 한 번만 계산한다.
  const seenBldIds = new Set();
  const shadowFeatures = [];
  for (const feature of renderedFeatures) {
    const height = feature.properties.HEIGHT;
    if (!height || height <= 0) continue;

    const bldId = feature.properties.BLD_ID;
    if (bldId != null) {
      if (seenBldIds.has(bldId)) continue;
      seenBldIds.add(bldId);
    }

    const shadowLength = height / Math.tan(sunPos.altitude);
    const translated = turf.transformTranslate(feature, shadowLength, shadowBearingDeg, { units: 'meters' });
    const hull = turf.convex(turf.featureCollection([feature, translated]));
    if (hull) shadowFeatures.push(hull);
  }

  map.getSource('shadows').setData(turf.featureCollection(shadowFeatures));
}

slider.addEventListener('input', () => {
  timeLabel.textContent = minutesToHHMM(+slider.value);
  updateShadows();
});

// ── 지도 로드 ────────────────────────────────────────────────────
map.on('load', () => {
  map.addSource('buildings', {
    type: 'vector',
    url: `pmtiles://${BUILDINGS_PMTILES_URL}`
  });
  map.addLayer({
    id: 'buildings-fill',
    type: 'fill',
    source: 'buildings',
    'source-layer': BUILDINGS_SOURCE_LAYER,
    paint: { 'fill-color': '#999999', 'fill-opacity': 0.35 }
  });

  map.addSource('shadows', { type: 'geojson', data: emptyFC() });
  map.addLayer({
    id: 'shadows-fill',
    type: 'fill',
    source: 'shadows',
    paint: { 'fill-color': '#222222', 'fill-opacity': 0.4 }
  });

  map.addSource('routes', { type: 'geojson', data: emptyFC() });
  map.addLayer({
    id: 'route-shortest',
    type: 'line',
    source: 'routes',
    filter: ['==', ['get', 'label'], 'shortest'],
    paint: { 'line-color': '#888888', 'line-width': 5 }
  });
  map.addLayer({
    id: 'route-shady',
    type: 'line',
    source: 'routes',
    filter: ['==', ['get', 'label'], 'shady'],
    paint: { 'line-color': '#2ecc71', 'line-width': 5 }
  });

  map.addSource('route-labels', { type: 'geojson', data: emptyFC() });
  map.addLayer({
    id: 'route-labels',
    type: 'symbol',
    source: 'route-labels',
    layout: {
      'text-field': ['get', 'label'],
      'text-font': ['Noto Sans Regular'],
      'text-size': 13,
      'text-offset': [0, 0.2]
    },
    paint: {
      'text-color': ['get', 'color'],
      'text-halo-color': '#ffffff',
      'text-halo-width': 1.5
    }
  });

  updateShadows();
  map.on('moveend', updateShadows);
  // pmtiles 타일은 비동기로 들어오므로, buildings 소스에 새 타일이 로드될
  // 때마다(패닝/줌으로 화면 밖 건물이 새로 들어올 때마다) 그림자를 다시 그린다.
  map.on('sourcedata', (e) => {
    if (e.sourceId === 'buildings' && e.isSourceLoaded) {
      updateShadows();
    }
  });
});

// ── 출발/도착 클릭 ────────────────────────────────────────────────
map.on('click', async (e) => {
  if (clickPoints.length >= 2) {
    resetSelection();
  }

  clickPoints.push(e.lngLat);
  const marker = new maplibregl.Marker({ color: clickPoints.length === 1 ? '#3388ff' : '#e74c3c' })
    .setLngLat(e.lngLat)
    .addTo(map);
  markers.push(marker);

  if (clickPoints.length === 2) {
    await fetchRoute(clickPoints[0], clickPoints[1]);
  }
});

function resetSelection() {
  clickPoints = [];
  markers.forEach(m => m.remove());
  markers = [];
  if (map.getSource('routes')) map.getSource('routes').setData(emptyFC());
  if (map.getSource('route-labels')) map.getSource('route-labels').setData(emptyFC());
  resultEl.style.display = 'none';
  statusEl.textContent = '';
}

document.getElementById('reset-btn').addEventListener('click', resetSelection);

async function fetchRoute(from, to) {
  statusEl.textContent = '경로 계산 중...';
  const at = `${REPRESENTATIVE_DATE}T${minutesToHHMM(+slider.value)}:00+09:00`;
  const url = `${API_BASE}/api/route`;
  const body = {
    from: { lat: from.lat, lon: from.lng },
    to: { lat: to.lat, lon: to.lng },
    at
  };

  let res;
  try {
    res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  } catch (err) {
    statusEl.textContent = `경로를 찾을 수 없습니다 (${err.message})`;
    return;
  }

  if (!res.ok) {
    // 서버가 RouteNotFoundException/NodeSnapTooFarException 등에서 {"error": "..."}로
    // 구체적인 사유를 내려준다 — 응답 바디 파싱에 실패한 경우(네트워크 에러 등)에만
    // "HTTP 상태코드"뿐인 일반 메시지로 폴백한다.
    let message = `경로를 찾을 수 없습니다 (HTTP ${res.status})`;
    try {
      const body = await res.json();
      if (body && body.error) message = body.error;
    } catch (err) {
      // 바디 파싱 실패 — 위의 일반 메시지를 그대로 쓴다.
    }
    statusEl.textContent = message;
    return;
  }

  const data = await res.json();
  statusEl.textContent = '';
  renderRoutes(data);
}

function renderRoutes(data) {
  const lineFeatures = data.routes.map(r => ({
    type: 'Feature',
    properties: { label: r.label, distanceM: r.distanceM, avgShadeRatio: r.avgShadeRatio },
    geometry: r.geometry
  }));
  map.getSource('routes').setData(turf.featureCollection(lineFeatures));

  const labelFeatures = data.routes.map(r => {
    const coords = r.geometry.coordinates;
    const mid = coords[Math.floor(coords.length / 2)];
    const name = r.label === 'shortest' ? '최단' : '그늘';
    const pct = Math.round(r.avgShadeRatio * 100);
    const color = r.label === 'shortest' ? '#888888' : '#2ecc71';
    return {
      type: 'Feature',
      properties: { label: `${name} ${pct}%`, color },
      geometry: { type: 'Point', coordinates: mid }
    };
  });
  map.getSource('route-labels').setData(turf.featureCollection(labelFeatures));

  const shortest = data.routes.find(r => r.label === 'shortest');
  const shady = data.routes.find(r => r.label === 'shady');
  document.getElementById('r-shortest').textContent =
    `${Math.round(shortest.distanceM)}m · 그늘 ${Math.round(shortest.avgShadeRatio * 100)}%`;
  document.getElementById('r-shady').textContent =
    `${Math.round(shady.distanceM)}m · 그늘 ${Math.round(shady.avgShadeRatio * 100)}%`;
  resultEl.style.display = 'block';
}
</script>
</body>
</html>
